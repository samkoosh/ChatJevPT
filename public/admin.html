<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f1e1c" />
    <title>ChatJevPT Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <a class="brand" href="/" title="Back to chat">
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><use href="#spark" /></svg>
        <span>ChatJevPT</span>
      </a>
      <span class="model-pill">Admin</span>
    </header>

    <main class="admin">
      <div class="admin-gate notice" id="gate" hidden></div>

      <div id="panel" hidden>
        <h1>People</h1>
        <p class="admin-lede" id="lede"></p>
        <p class="admin-status" id="status" role="status" aria-live="polite"></p>

        <section class="admin-section" id="requests-section" hidden>
          <h2>Waiting for access</h2>
          <ul class="admin-requests" id="requests"></ul>
        </section>

        <section class="admin-section">
          <h2>Add person</h2>
          <form class="admin-add-form" id="add-form">
            <input type="email" id="add-email" placeholder="name@gmail.com" aria-label="Email" required />
            <label class="budget-field">
              <span>$</span>
              <input type="number" id="add-budget" min="0" max="1000" step="0.01" aria-label="Monthly budget in dollars" />
              <span>/ month</span>
            </label>
            <button type="submit" class="btn primary">Add</button>
          </form>
        </section>

        <section class="admin-section">
          <h2>Everyone</h2>
          <table class="admin-users">
            <thead>
              <tr>
                <th>Email</th>
                <th>Name</th>
                <th>Role</th>
                <th>Status</th>
                <th>This month</th>
                <th>Tokens</th>
                <th>Last seen</th>
                <th><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="users"></tbody>
          </table>
        </section>
      </div>
    </main>

    <svg width="0" height="0" style="position: absolute">
      <symbol id="spark" viewBox="0 0 24 24">
        <path
          d="M12 1.5c.4 4.9 1.6 7.6 3.3 8.9 1.7 1.3 4.2 1.6 7.2 1.6-3 0-5.5.3-7.2 1.6-1.7 1.3-2.9 4-3.3 8.9-.4-4.9-1.6-7.6-3.3-8.9C7 12.3 4.5 12 1.5 12c3 0 5.5-.3 7.2-1.6C10.4 9.1 11.6 6.4 12 1.5Z"
        />
      </symbol>
    </svg>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
